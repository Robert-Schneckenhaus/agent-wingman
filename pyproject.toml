[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "agent-wingman"
version = "0.1.0"
description = "Code index and knowledge store that helps AI agents find relevant code fast."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "alembic>=1.13",
    "click>=8.1",
    "pathspec>=0.12",
    "sqlalchemy>=2.0",
    "tree-sitter>=0.23",
    "tree-sitter-c-sharp>=0.23",
    "tree-sitter-typescript>=0.23",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
wingman = "wingman.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wingman"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/wingman/storage/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
