[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "agent-wingman"
version = "0.1.0"
description = "Code index and knowledge store that helps AI agents find relevant code fast."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "alembic>=1.13",
    "click>=8.1",
    "httpx>=0.27",
    "mcp>=2.0",
    "numpy>=1.26",
    "pathspec>=0.12",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "tree-sitter>=0.23",
    "tree-sitter-c>=0.23",
    "tree-sitter-c-sharp>=0.23",
    "tree-sitter-cpp>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-php>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-typescript>=0.23",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
embeddings = ["fastembed>=0.4"]
summaries = ["anthropic>=2.3"]
docs = ["pypdf>=4.0"]
dev = ["pytest>=8", "ruff>=0.6", "anthropic>=2.3", "pypdf>=4.0"]

[project.scripts]
wingman = "wingman.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wingman"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]  # sample repositories, not tests of wingman
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/wingman/storage/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/test_context.py" = ["E501"]  # verbatim stack traces
"tests/test_incremental.py" = ["E501"]  # source snippets in the scenarios
